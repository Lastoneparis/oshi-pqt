name: Protocol proposal
description: Propose a standards-aligned improvement to OSHI.
title: "[Proposal]: "
labels: ["proposal"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete deployment or security problem does this solve?
    validations:
      required: true
  - type: textarea
    id: standards
    attributes:
      label: Standards and compatibility
      description: Link relevant IETF, NIST, CA/B Forum, or browser work.
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Proposed design
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and alternatives
